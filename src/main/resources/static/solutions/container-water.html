<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盛最多水的容器 - 可视化演示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header h1 { color: #333; margin-bottom: 8px; }
        .badge { background: #fff7e6; color: #fa8c16; padding: 4px 12px; border-radius: 4px; font-size: 12px; }
        .visualization { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .container-viz { display: flex; align-items: flex-end; justify-content: center; gap: 4px; height: 200px; margin: 20px 0; padding: 0 20px; }
        .bar {
            width: 40px; background: linear-gradient(to top, #1890ff, #69c0ff);
            border-radius: 4px 4px 0 0; transition: all 0.3s; position: relative;
        }
        .bar.left { background: linear-gradient(to top, #52c41a, #95de64); }
        .bar.right { background: linear-gradient(to top, #722ed1, #b37feb); }
        .bar span {
            position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%);
            font-size: 12px; color: #666;
        }
        .bar-label {
            position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
            font-size: 14px; font-weight: bold;
        }
        .water {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(82, 196, 26, 0.3); border-radius: 4px 4px 0 0;
        }
        .info { text-align: center; margin: 20px 0; font-size: 18px; }
        .info strong { color: #1890ff; }
        .result { background: #f6ffed; border: 1px solid #b7eb8f; padding: 16px; border-radius: 8px; text-align: center; }
        .result h3 { color: #52c41a; margin-bottom: 8px; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #1890ff; color: white; }
        .btn-success { background: #52c41a; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>11. 盛最多水的容器</h1>
            <div class="badge">中等</div>
        </div>
        <div class="visualization">
            <div class="controls">
                <button class="btn btn-primary" onclick="runVisualization()">▶ 开始演示</button>
                <button class="btn btn-success" onclick="reset()">↺ 重置</button>
            </div>
            <div class="container-viz" id="container"></div>
            <div class="info" id="info">高度: [1,8,6,2,5,4,8,3,7]</div>
            <div class="result" id="result">
                <h3>双指针解法</h3>
                <p>移动较短边的指针</p>
            </div>
        </div>
    </div>
    <script>
        const heights = [1,8,6,2,5,4,8,3,7];
        let left = 0, right = heights.length - 1, maxArea = 0;
        const container = document.getElementById('container');
        container.innerHTML = heights.map((h, i) => `
            <div class="bar" id="bar${i}" style="height: ${h * 20}px;">
                <span>${h}</span>
            </div>
        `).join('');

        function runVisualization() {
            if (left >= right) return;

            document.querySelectorAll('.bar').forEach(b => {
                b.classList.remove('left', 'right');
                b.style.background = '';
            });

            const barLeft = document.getElementById(`bar${left}`);
            const barRight = document.getElementById(`bar${right}`);
            barLeft.classList.add('left');
            barRight.classList.add('right');

            const height = Math.min(heights[left], heights[right]);
            const width = right - left;
            const area = height * width;

            document.getElementById('info').innerHTML = `
                高度: min(${heights[left]}, ${heights[right]}) = ${height}<br>
                宽度: ${right} - ${left} = ${width}<br>
                面积: ${height} × ${width} = <strong>${area}</strong>
            `;

            if (area > maxArea) maxArea = area;

            if (heights[left] < heights[right]) {
                left++;
            } else {
                right--;
            }

            if (left >= right) {
                document.getElementById('result').innerHTML = `
                    <h3>✅ 最大面积: ${maxArea}</h3>
                    <p>双指针遍历完成</p>
                `;
            }
        }

        function reset() {
            left = 0; right = heights.length - 1; maxArea = 0;
            document.querySelectorAll('.bar').forEach(b => {
                b.classList.remove('left', 'right');
            });
            document.getElementById('info').innerHTML = '高度: [1,8,6,2,5,4,8,3,7]';
            document.getElementById('result').innerHTML = '<h3>双指针解法</h3><p>移动较短边的指针</p>';
        }
    </script>
</body>
</html>
