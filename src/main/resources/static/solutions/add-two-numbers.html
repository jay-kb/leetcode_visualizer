<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>两数相加 - 可视化演示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header h1 { color: #333; margin-bottom: 8px; }
        .badge { background: #fff1f0; color: #f5222d; padding: 4px 12px; border-radius: 4px; font-size: 12px; }
        .visualization { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .lists { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 20px; margin: 20px 0; }
        .list-box { text-align: center; }
        .list-box h4 { margin-bottom: 12px; color: #666; }
        .linked-list { display: flex; align-items: center; gap: 8px; }
        .node { display: flex; align-items: center; }
        .node-val { min-width: 40px; height: 40px; background: #1890ff; color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .node-arrow { width: 20px; height: 2px; background: #333; }
        .carry { background: #faad14; }
        .result-box { text-align: center; margin-top: 20px; padding: 20px; background: #f6ffed; border-radius: 8px; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #1890ff; color: white; }
        .btn-success { background: #52c41a; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>2. 两数相加</h1><div class="badge">困难</div></div>
        <div class="visualization">
            <div class="controls">
                <button class="btn btn-primary" onclick="runVisualization()">▶ 开始演示</button>
                <button class="btn btn-success" onclick="reset()">↺ 重置</button>
            </div>
            <div class="lists">
                <div class="list-box"><h4>L1: 2 → 4 → 3</h4><div class="linked-list" id="l1"></div></div>
                <div class="list-box"><h4>L2: 5 → 6 → 4</h4><div class="linked-list" id="l2"></div></div>
            </div>
            <div class="result-box" id="result"><h3>结果: 7 → 0 → 8</h3><p>342 + 465 = 807</p></div>
        </div>
    </div>
    <script>
        const l1 = [2, 4, 3], l2 = [5, 6, 4];
        let step = 0;
        function render() {
            document.getElementById('l1').innerHTML = l1.map(v => `<div class="node"><div class="node-val">${v}</div><div class="node-arrow"></div></div>`).join('') + '<div class="node-val">null</div>';
            document.getElementById('l2').innerHTML = l2.map(v => `<div class="node"><div class="node-val">${v}</div><div class="node-arrow"></div></div>`).join('') + '<div class="node-val">null</div>';
        }
        render();
        function runVisualization() {
            if (step >= 3) return;
            const result = document.getElementById('result');
            const sum = l1[step] + l2[step] + (step > 0 && step < 3 ? Math.floor((l1[step-1] + l2[step-1])/10) : 0);
            const carry = sum >= 10 ? 1 : 0;
            result.innerHTML = `<h3>第 ${step + 1} 位: ${l1[step]} + ${l2[step]} = ${sum}${carry ? ' (进位1)' : ''}</h3><p>结果: ${sum % 10}</p>`;
            step++;
        }
        function reset() { step = 0; render(); document.getElementById('result').innerHTML = '<h3>结果: 7 → 0 → 8</h3><p>342 + 465 = 807</p>'; }
    </script>
</body>
</html>
