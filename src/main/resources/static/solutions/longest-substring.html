<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无重复字符的最长子串 - 可视化演示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header h1 { color: #333; margin-bottom: 8px; }
        .badge { background: #fff7e6; color: #fa8c16; padding: 4px 12px; border-radius: 4px; font-size: 12px; }
        .visualization { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .string-display { font-size: 24px; letter-spacing: 8px; margin: 20px 0; text-align: center; }
        .char { display: inline-block; padding: 8px; border-radius: 4px; transition: all 0.3s; }
        .char.current { background: #1890ff; color: white; transform: scale(1.2); }
        .char.window { background: #d9f7be; }
        .char.duplicate { background: #ff4d4f; color: white; }
        .info { background: #f5f5f5; padding: 16px; border-radius: 8px; margin: 20px 0; }
        .info p { margin: 8px 0; }
        .max-len { font-size: 20px; color: #52c41a; font-weight: bold; }
        .result { background: #f6ffed; border: 1px solid #b7eb8f; padding: 16px; border-radius: 8px; text-align: center; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #1890ff; color: white; }
        .btn-success { background: #52c41a; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>3. 无重复字符的最长子串</h1>
            <div class="badge">中等</div>
        </div>
        <div class="visualization">
            <div class="controls">
                <button class="btn btn-primary" onclick="runVisualization()">▶ 开始演示</button>
                <button class="btn btn-success" onclick="reset()">↺ 重置</button>
            </div>
            <div class="string-display" id="display"></div>
            <div class="info">
                <p>当前窗口: <span id="window"></span></p>
                <p>窗口长度: <span id="len">0</span></p>
                <p class="max-len">最大长度: <span id="maxLen">0</span></p>
            </div>
            <div class="result" id="result">
                <p>使用滑动窗口解决</p>
            </div>
        </div>
    </div>
    <script>
        const s = "abcabcbb";
        let i = 0, j = 0, maxLen = 0, start = 0;
        const seen = new Set();

        const display = document.getElementById('display');
        display.innerHTML = s.split('').map((c, idx) => `<span class="char" id="c${idx}">${c}</span>`).join('');

        function runVisualization() {
            if (j >= s.length) {
                document.getElementById('result').innerHTML = `<h3>✅ 最大长度: ${maxLen}</h3><p>子串: "${s.substring(start, start + maxLen)}"</p>`;
                return;
            }

            document.querySelectorAll('.char').forEach(c => c.classList.remove('current', 'window', 'duplicate'));

            for (let k = i; k <= j; k++) {
                document.getElementById(`c${k}`).classList.add('window');
            }

            if (seen.has(s[j])) {
                document.getElementById(`c${j}`).classList.add('duplicate');
                while (seen.has(s[j])) {
                    seen.delete(s[i]);
                    document.getElementById(`c${i}`).classList.remove('window');
                    i++;
                }
            }

            seen.add(s[j]);
            document.getElementById(`c${j}`).classList.add('current');

            const currentLen = j - i + 1;
            if (currentLen > maxLen) {
                maxLen = currentLen;
                start = i;
            }

            document.getElementById('window').textContent = s.substring(i, j + 1);
            document.getElementById('len').textContent = currentLen;
            document.getElementById('maxLen').textContent = maxLen;

            j++;
        }

        function reset() {
            i = 0; j = 0; maxLen = 0; start = 0;
            seen.clear();
            document.querySelectorAll('.char').forEach(c => c.classList.remove('current', 'window', 'duplicate'));
            document.getElementById('window').textContent = '';
            document.getElementById('len').textContent = '0';
            document.getElementById('maxLen').textContent = '0';
            document.getElementById('result').innerHTML = '<p>使用滑动窗口解决</p>';
        }
    </script>
</body>
</html>
