server:
  port: 8080  # 后端服务端口

spring:
  application:
    name: leetcode-visualizer  # 应用名称

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver  # MySQL 驱动
    url: jdbc:mysql://localhost:3306/leetcode_visualizer?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root  # 数据库用户名
    password: root  # 数据库密码

  # Redis 配置
  redis:
    host: localhost  # Redis 主机地址
    port: 6379      # Redis 端口
    database: 0      # Redis 数据库编号
    password: root  # Redis 密码
    username: default  # Redis 用户名

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB   # 单个文件最大大小
      max-request-size: 50MB  # 请求最大大小

  # JSON 日期格式配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss  # 日期格式
    time-zone: Asia/Shanghai  # 时区

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml  # Mapper XML 文件路径
  type-aliases-package: com.leetcode.visualizer.entity  # 实体类包路径
  configuration:
    map-underscore-to-camel-case: true  # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # SQL 日志输出
  global-config:
    db-config:
      logic-delete-field: deleted  # 逻辑删除字段
      logic-delete-value: 1        # 删除值
      logic-not-delete-value: 0    # 未删除值

# 文件上传配置（存储到 Nginx 资源目录）
file:
  upload:
    # HTML 可视化文件存储路径（对应 Nginx /solutions/ 路径）
    path: /Users/qinsx/project/AI/leetcode_visualizer/nginx/html/solutions/
    # 封面图片存储路径（对应 Nginx /covers/ 路径）
    covers-path: /Users/qinsx/project/AI/leetcode_visualizer/nginx/html/covers/

# JWT 认证配置
jwt:
  secret: leetcode-visualizer-secret-key-2024  # JWT 密钥
  expiration: 86400  # Token 有效期（秒），24小时
