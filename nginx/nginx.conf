# LeetCode Visualizer Nginx 配置

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ==================== 用户端 (端口 80) ====================
    server {
        listen 80;
        # server_name 可以配置为你的域名，如: server_name api.yourdomain.com;
        # 支持配置多个域名，用空格分隔
        server_name localhost;
        server_name 127.0.0.1;
        server_name mabelle-gapy-cicely.ngrok-free.dev;

        # 管理后台登录页（精确匹配 /login，转发到 8083 端口）
        location = /login {
            proxy_pass http://127.0.0.1:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 管理后台页面路由（将 /admin 和 /admin/* 转发到 8083 端口）
        location /admin {
            proxy_pass http://127.0.0.1:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 题解可视化 HTML 文件
        location /solutions/ {
            alias /Users/qinsx/project/AI/leetcode_visualizer/nginx/html/solutions/;
            index index.html;
        }

        # 封面图片
        location /covers/ {
            alias /Users/qinsx/project/AI/leetcode_visualizer/nginx/html/covers/;
        }

        # API 代理
        location /api/ {
            proxy_pass http://localhost:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 用户端前端构建文件
        location / {
            root /Users/qinsx/project/AI/leetcode_visualizer/frontend/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # ==================== 管理后台 (端口 8083) ====================
    server {
        listen 8083;
        # server_name 可以配置为你的域名，如: server_name admin.yourdomain.com;
        # 支持配置多个域名，用空格分隔
        server_name localhost;
        server_name 127.0.0.1;

        # 管理后台前端根路径
        location / {
            root /Users/qinsx/project/AI/leetcode_visualizer/frontend/admin/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 用户端 API 代理 (将 /api/* 转发到 8080 后端)
        location /api/ {
            proxy_pass http://localhost:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /login {
            root /Users/qinsx/project/AI/leetcode_visualizer/frontend/admin/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
